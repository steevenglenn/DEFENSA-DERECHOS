<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Derechos: Chat Comunitario</title>
    
    <!-- Configuración para App Móvil -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo.jpeg">
    <link rel="icon" href="logo.jpeg" type="image/jpeg">
    <meta name="theme-color" content="#0A3A60">

    <style>
        :root {
            --brandAzul: #0A3A60;
            --brandAmarillo: #F2A922;
            --brandVerde: #075E54; /* Verde WhatsApp */
            --brandVerdeClaro: #DCEFDC; /* Burbuja WhatsApp */
            --brandFondo: #E5DDD5; /* Fondo clásico WhatsApp */
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            background-color: #f0f2f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        header {
            background-color: var(--brandAzul);
            color: white;
            padding: 1rem;
            text-align: center;
            border-bottom: 4px solid var(--brandAmarillo);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .logo-container {
            width: 70px;
            height: 70px;
            margin: 0 auto 0.5rem;
            border-radius: 50%;
            background-color: white;
            padding: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .logo-img { width: 100%; height: 100%; object-fit: cover; }
        h1 { font-size: 1.5rem; font-weight: 800; }
        .subtitle { color: var(--brandAmarillo); font-size: 0.8rem; font-weight: bold; text-transform: uppercase; }
        
        main {
            max-width: 600px;
            width: 100%;
            margin: 1rem auto;
            padding: 0 0.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background-image: url('https://githubusercontent.com'); /* Fondo patrón WhatsApp */
            background-color: var(--brandFondo);
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
            height: 70vh;
        }

        .select-box {
            background: white;
            padding: 0.7rem;
            border-bottom: 1px solid #ddd;
        }
        select {
            width: 100%;
            padding: 0.5rem;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 0.9rem;
            outline: none;
        }

        /* CONTENEDOR DE MENSAJES ESTILO CHAT */
        .chat-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .msg-bubble {
            max-width: 85%;
            padding: 0.6rem 0.8rem;
            border-radius: 8px;
            font-size: 0.9rem;
            position: relative;
            box-shadow: 0 1px 2px rgba(0,0,0,0.15);
            line-height: 1.4;
            word-wrap: break-word;
        }
        /* Tipo Opinión (Izquierda - Gris/Blanco) */
        .msg-opinion {
            background-color: white;
            align-self: flex-start;
            border-top-left-radius: 0;
        }
        /* Tipo Solución (Derecha - Verde WhatsApp) */
        .msg-solucion {
            background-color: var(--brandVerdeClaro);
            align-self: flex-end;
            border-top-right-radius: 0;
        }

        .msg-user {
            font-weight: bold;
            font-size: 0.75rem;
            margin-bottom: 0.2rem;
            display: block;
        }
        .user-opinion { color: #2b6cb0; }
        .user-solucion { color: #2f855a; }

        .msg-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.65rem;
            color: #777;
            margin-top: 0.3rem;
        }
        .msg-tag {
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.6rem;
            padding: 1px 4px;
            border-radius: 3px;
            margin-right: 5px;
        }
        .tag-op { background: #ebf8ff; color: #2b6cb0; }
        .tag-sol { background: #e6fffa; color: #234e52; }

        /* FORMULARIO DE ENVÍO ESTILO BARRA DE WHATSAPP */
        .input-area {
            background-color: #f0f0f0;
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            border-top: 1px solid #ddd;
        }
        .input-row-top {
            display: flex;
            gap: 0.5rem;
        }
        .input-row-bottom {
            display: flex;
            gap: 0.5rem;
        }
        input[type="text"] {
            flex-grow: 1;
            border: 1px solid #ccc;
            padding: 0.5rem;
            border-radius: 20px;
            outline: none;
            font-size: 0.9rem;
            background: white;
        }
        .chat-btn {
            border: none;
            padding: 0.5rem 1rem;
            color: white;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }
        .btn-op { background-color: var(--brandAzul); }
        .btn-sol { background-color: var(--brandVerde); }
        .btn-op:hover { opacity: 0.9; }
        .btn-sol:hover { opacity: 0.9; }

        footer { background-color: #333; color: #aaa; text-align: center; padding: 0.5rem; font-size: 0.7rem; }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="logo.jpeg" alt="Logo Derechos" class="logo-img">
        </div>
        <h1>DERECHOS</h1>
        <p class="subtitle">Sala de Interacción en Vivo</p>
    </header>

    <div class="select-box">
        <select id="derecho-select">
            <option value="educacion">📚 Acceso a la Educación de Calidad</option>
            <option value="salud">🏥 Acceso a la Salud Digna</option>
            <option value="trabajo">💼 Trabajo Justo y Salario Digno</option>
            <option value="expresion">🗣️ Libertad de Expresión y Opinión</option>
            <option value="igualdad">⚖️ Interrupción de la Igualdad y Discriminación</option>
        </select>
    </div>

    <main>
        <!-- CONTENEDOR DONDE SE VAN A VER LOS MENSAJES -->
        <div id="chat-box" class="chat-container">
            <p style="text-align:center; color:#777; font-size:0.8rem; margin-top:2rem;">Conectando al chat comunitario...</p>
        </div>

        <!-- BARRA DE ENTRADA DE TEXTO -->
        <form id="chat-form" class="input-area">
            <div class="input-row-top">
                <input type="text" id="user-name" placeholder="Tu Nombre o Anónimo" required style="max-width: 150px;">
                <input type="text" id="user-msg" placeholder="Escribe un mensaje aquí..." required>
            </div>
            <div class="input-row-bottom">
                <button type="button" id="send-opinion" class="chat-btn btn-op" style="flex:1;">💬 Publicar Opinión</button>
                <button type="button" id="send-solucion" class="chat-btn btn-sol" style="flex:1;">💡 Proponer Solución</button>
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Derechos: Defensa y Soluciones. Chat Global en Tiempo Real.</p>
    </footer>

    <script>
        // BASE DE DATOS TOTALMENTE LIBERADA Y ABIERTA (Sin bloqueos)
        const CHAT_API = "https://restful-api.dev"; 

        const derechoSelect = document.getElementById('derecho-select');
        const chatBox = document.getElementById('chat-box');
        const userNameInput = document.getElementById('user-name');
        const userMsgInput = document.getElementById('user-msg');

        derechoSelect.addEventListener('change', cargarChat);
        document.addEventListener('DOMContentLoaded', () => {
            cargarChat();
            // Actualización automática tipo WhatsApp cada 4 segundos
            setInterval(cargarChat, 4000);
        });

        // Evento Enviar Opinión
        document.getElementById('send-opinion').addEventListener('click', () => enviarMensaje('opinion'));
        // Evento Enviar Solución
        document.getElementById('send-solucion').addEventListener('click', () => enviarMensaje('solucion'));

        // Guardar Mensaje en la Nube
        async function enviarMensaje(tipo) {
            const nombre = userNameInput.value.trim();
            const mensaje = userMsgInput.value.trim();
            const derecho = derechoSelect.value;

            if(!nombre || !mensaje) {
                alert("Por favor rellena tu nombre y el mensaje.");
                return;
            }

            // Crear el paquete de datos estructurado para simular base de datos abierta
            const payload = {
                name: `DERECHO_APP_${derecho}`,
                data: {
                    tipo: tipo,
                    nombre: nombre,
                    texto: mensaje,
                    fecha: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                }
            };

            userMsgInput.value = ''; // Limpiar caja de texto rápido

            await fetch(CHAT_API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            cargarChat(); // Recargar chat al instante
        }

        // Descargar todos los mensajes guardados por los usuarios
